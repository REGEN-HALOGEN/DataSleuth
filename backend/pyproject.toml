[project]
name = "datasleuth"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi==25.1.0",
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "SQLAlchemy==2.0.45",
    "alembic==1.17.2",
    "psycopg[binary]==3.2.10",
    "redis==6.4.0",
    "python-dotenv==1.1.1",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.5",
    "ruff==0.11.11",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]
