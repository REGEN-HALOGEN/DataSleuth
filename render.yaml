services:
  - type: web
    name: datasleuth-api
    runtime: docker
    plan: 1c-2g
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: "off"
    maxShutdownDelaySeconds: 30
    healthCheckPath: /health/ready
    envVars:
      - key: DATASLEUTH_MODE
        value: "hosted"
      - key: LOG_LEVEL
        value: "INFO"
      - key: MAX_FILE_SIZE_BYTES
        value: "10485760"
      - key: MAX_SCAN_DEPTH
        value: "10"
      - key: MAX_FILES_PER_SCAN
        value: "10000"
      - key: MAX_PROCESSING_SECONDS_PER_FILE
        value: "30"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_STORAGE_URL
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: SUPABASE_STORAGE_KEY
        sync: false
      - key: UPLOAD_INTEGRITY_KEY
        sync: false
      - key: BROWSER_ORIGIN
        sync: false
      - key: APPLICATION_SECRET
        sync: false
  - type: worker
    name: datasleuth-worker
    runtime: docker
    plan: 1c-2g
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: "off"
    maxShutdownDelaySeconds: 30
    dockerCommand: python -m app.workers.scan
    envVars:
      - key: DATASLEUTH_MODE
        value: "hosted"
      - key: LOG_LEVEL
        value: "INFO"
      - key: MAX_FILE_SIZE_BYTES
        value: "10485760"
      - key: MAX_SCAN_DEPTH
        value: "10"
      - key: MAX_FILES_PER_SCAN
        value: "10000"
      - key: MAX_PROCESSING_SECONDS_PER_FILE
        value: "30"
      - key: HMAC_KEY_VERSION
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_STORAGE_URL
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: SUPABASE_STORAGE_KEY
        sync: false
      - key: UPLOAD_INTEGRITY_KEY
        sync: false
      - key: HMAC_KEY
        sync: false
